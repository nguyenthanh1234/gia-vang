name: Cập nhật giá vàng

on:
  schedule:
    - cron: "*/30 * * * *"   # mỗi 30 phút (GitHub có thể chạy trễ vài phút)
  workflow_dispatch:          # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

concurrency:
  group: update-price
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lấy giá mới
        run: python scripts/update.py
      - name: Lưu vào kho
        run: |
          git config user.name "gia-vang-bot"
          git config user.email "gia-vang-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Cập nhật giá $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
